# local dev profile: H2 file database, no MySQL install needed
# run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:file:./data/jiraclone;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# browse data at http://localhost:8080/h2-console
spring.h2.console.enabled=true
